name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Only one preview build per PR — cancel in-flight runs when a new commit
# arrives. Saves CI minutes and avoids racing version uploads.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork PRs don't have access to secrets — the upload would fail. Skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @cloudflare/vite-plugin bakes ONE wrangler env into the redirected
      # config it emits at `dist/server/wrangler.json`. CLOUDFLARE_ENV=preview
      # tells it to project env.preview's Worker name, KV binding, and empty
      # routes into that flattened config; the later `wrangler versions
      # upload --env preview` cross-checks the targetEnvironment matches and
      # then deploys exactly that artifact.
      - name: Build for preview env
        run: CLOUDFLARE_ENV=preview npm run build

      # The TanStack Start Vite plugin generated src/routeTree.gen.ts during
      # the build above, so typecheck reads it without re-running the build.
      - name: Typecheck
        run: npm run typecheck

      # `versions upload` stages a new version of the
      # `ar-det-ko-till-hono-preview` Worker. With preview_urls=true (set at
      # the top of wrangler.jsonc, inherited by every env) each version gets
      # its own <short-id>-ar-det-ko-till-hono-preview.<acct>.workers.dev URL.
      #
      # Wrangler doesn't print that URL in its output, so we parse the Worker
      # Version ID, look up the account's workers.dev subdomain via the CF
      # API, and reconstruct it.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload --env preview 2>&1 | tee upload.log

          version_id=$(grep -Eo 'Worker Version ID: [a-f0-9-]+' upload.log | awk '{print $4}')
          if [ -z "$version_id" ]; then
            echo "::error::Could not parse Worker Version ID from wrangler output"
            exit 1
          fi
          short_id=${version_id:0:8}

          subdomain=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          if [ -z "$subdomain" ]; then
            echo "::error::Could not fetch workers.dev subdomain from CF API"
            exit 1
          fi

          url="https://${short_id}-ar-det-ko-till-hono-preview.${subdomain}.workers.dev"
          echo "Preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # One new comment per push so each deploy leaves its own entry — easy
      # to scroll back through previous versions while reviewing a PR.
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              '### Preview deploy',
              '',
              `**${url}**`,
              '',
              `Commit \`${sha}\`. Unguessable URL — keep it within the team.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
